<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kevin Jonathan — portfolio</title>
<meta name="description" content="Portfolio and project showcase." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0e14;
    --surface: #10151d;
    --surface-2: #161d27;
    --border: #212a37;
    --text: #e6e8eb;
    --muted: #6b7785;
    --accent: #7dd3c0;
    --accent-2: #c792ea;
    --accent-dim: rgba(125, 211, 192, 0.12);
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  #root { min-height: 100vh; }
  ::selection { background: var(--accent); color: #0a0e14; }

  a { color: inherit; }

  .bg-grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(125,211,192,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(125,211,192,0.035) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 40%, transparent 100%);
  }

  .wrap { position: relative; z-index: 1; max-width: 920px; margin: 0 auto; padding: 0 24px; }

  .tabbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(10,14,20,0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .tabbar-inner {
    max-width: 920px; margin: 0 auto; padding: 0 24px;
    display: flex; align-items: center; height: 48px; gap: 2px;
    overflow-x: auto;
  }
  .tabbar-dots { display:flex; gap:6px; margin-right: 16px; flex-shrink:0; }
  .dot { width:10px; height:10px; border-radius:50%; }
  .dot.red{background:#e0605080;} .dot.yellow{background:#e5c07b80;} .dot.green{background:#7dd3c080;}
  .tab {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--muted);
    background: transparent;
    border: none;
    border-right: 1px solid var(--border);
    padding: 0 16px;
    height: 100%;
    display:flex; align-items:center; gap:8px;
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.15s, background 0.15s;
  }
  .tab:hover { color: var(--text); background: var(--surface); }
  .tab.active { color: var(--accent); background: var(--surface); box-shadow: inset 0 -2px 0 var(--accent); }
  .tab .ext { color: var(--accent-2); opacity: 0.7; }
  .tab .dirty { width:6px; height:6px; border-radius:50%; background: var(--muted); }

  section { position: relative; z-index: 1; padding: 96px 0; border-bottom: 1px solid var(--border); }
  section:last-of-type { border-bottom: none; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    letter-spacing: 0.02em;
  }
  .eyebrow::before { content: ''; width: 20px; height: 1px; background: var(--accent); opacity: 0.5; }

  .hero { padding-top: 72px; }
  .terminal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,0.6);
  }
  .terminal-head {
    display:flex; align-items:center; gap:8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .terminal-head .dot { width:11px; height:11px; }
  .terminal-head .path {
    margin-left: 10px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }
  .terminal-body {
    padding: 28px 28px 32px;
    font-family: var(--mono);
    font-size: 15px;
    line-height: 1.8;
    min-height: 210px;
  }
  .prompt-line { color: var(--muted); }
  .prompt-sym { color: var(--accent); }
  .type-out { color: var(--text); }
  .cursor {
    display: inline-block;
    width: 8px; height: 1.1em;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .hero-name {
    font-family: var(--mono);
    font-weight: 800;
    font-size: clamp(32px, 5vw, 52px);
    margin: 0 0 6px;
    letter-spacing: -0.02em;
  }
  .hero-name .dim { color: var(--muted); font-weight: 500; }
  .hero-role {
    font-size: 17px;
    color: var(--muted);
    max-width: 56ch;
    margin: 0 0 28px;
    line-height: 1.6;
  }
  .hero-role .hl { color: var(--accent); }

  .btn-row { display:flex; gap: 12px; flex-wrap: wrap; margin-bottom: 32px; }
  .btn {
    font-family: var(--mono);
    font-size: 13px;
    padding: 11px 20px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: border-color 0.15s, transform 0.15s, background 0.15s;
  }
  .btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .btn.primary { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .btn.primary:hover { background: var(--accent); color: #0a0e14; }

  h2.section-title {
    font-family: var(--mono);
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 20px;
  }
  .about-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 48px; }
  .about-text p { line-height: 1.85; color: #b6bdc6; font-size: 15.5px; margin: 0 0 16px; }
  .stack-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .stack-list li {
    font-family: var(--mono);
    font-size: 13.5px;
    color: var(--muted);
    display: grid;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px dashed var(--border);
    padding-bottom: 10px;
  }
  .stack-list li span:last-child { color: var(--accent-2); }

  .project-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: border-color 0.2s, transform 0.2s;
    text-decoration: none;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-3px); }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .file-name { font-family: var(--mono); font-weight: 700; font-size: 15.5px; color: var(--text); }
  .ext-badge {
    font-family: var(--mono);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--accent-dim);
    color: var(--accent);
    white-space: nowrap;
  }
  .card p.desc { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6; flex: 1; }
  .card-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    border-top: 1px solid var(--border); padding-top: 12px;
  }
  .diff { display: flex; gap: 10px; }
  .diff .plus { color: var(--accent); }
  .diff .minus { color: #e06050; }
  .tag-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-family: var(--mono); font-size: 11px;
    color: var(--muted); border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 7px;
  }

  .contact-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 40px;
    text-align: center;
  }
  .contact-box .eyebrow { justify-content: center; }
  .contact-box .eyebrow::before { display: none; }
  .contact-title { font-family: var(--mono); font-size: 28px; font-weight: 800; margin: 0 0 14px; }
  .contact-sub { color: var(--muted); max-width: 48ch; margin: 0 auto 28px; line-height: 1.7; }
  .contact-links { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

  footer {
    padding: 28px 0 40px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  @media (max-width: 720px) {
    .about-grid { grid-template-columns: 1fr; }
    .project-grid { grid-template-columns: 1fr; }
    section { padding: 64px 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
    html { scroll-behavior: auto; }
  }

  button:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>
<div class="bg-grid"></div>

<div id="root"></div>

<script>
const PROFILE = {
  name: "Kevin Jonathan Suparman Tay",
  handle: "kevinjonathanst",
  role: "Software developer.",
  bio: [
    "I'm a Full Stack Developer with 2 years of professional experience building web and mobile applications. I enjoy creating scalable, user-focused solutions using technologies like .NET, Laravel, Flutter, and modern JavaScript frameworks. I'm always exploring new technologies and continuously improving my skills through personal projects and real-world development.",
    
  ],
  stack: [
    { label: "Languages", value: "C#, Dart, Java, PHP, JavaScript, Python" },
    { label: "Frontend", value: "Flutter, React, HTML, CSS, Bootstrap, Tailwind CSS" },
    { label: "Backend", value: ".NET, ASP.NET Core, Laravel, REST APIs," },
    { label: "Database", value: "MySQL, SQL Server, Firebase Firestore" },
    { label: "Tools", value: "Git, GitHub, Visual Studio, VS Code, Android Studio, Postman" },
  ],
  links: {
    github: "https://github.com/kevinjonathanst",
    linkedin: "https://www.linkedin.com/in/kevin-j-28a26718b/",
    email: "mailto:kevinjonathanst@gmail.com",
  }
};

const PROJECTS = [
  {
    name: "Sportify", 
    ext: ".dart",
    desc: "Application to matchmake sports enthusiasts based on their interests and location, built with Flutter and Firebase.",
    tags: ["Flutter", "Dart", "Firebase"],
    url: "https://github.com/kevinjonathanst/Sportify",
  },
  {
    name: "Twoflo POS",
    ext: ".jsx",
    desc: "A point-of-sale system with table-based ordering, ingredient inventory, recipe costing, and sales management.",
    tags: ["React", "JavaScript", "Tailwind CSS", "Supabase", "PostgreSQL"],
    url: "#"
  },
  {
    name: "Anekaban",
    ext: ".html",
    desc: "A bilingual automotive business website featuring a tire catalog, service information, and an enquiry form.",
    tags: ["HTML", "CSS", "JavaScript"],
    url: "#"
  },
  {
    name: "Preorder",
    ext: ".tsx",
    desc: "A pre-order management app with an admin dashboard, multi-item orders, and dedicated order-tracking pages.",
    tags: ["React", "Next.js", "TypeScript", "Supabase", "PostgreSQL"],
    url: "#"
  },
  // {
  //   name: "project-four", ext: ".html",
  //   desc: "One-line description of what this project does and why you built it.",
  //   tags: ["HTML/CSS", "Design"], stats: { plus: 88, minus: 5 }, url: "#",
  // },
];
// ============================================================= //

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderTabBar() {
  const tabs = [
    { id: "home", label: "home", ext: ".sh" },
    { id: "about", label: "about", ext: ".md" },
    { id: "projects", label: "projects", ext: ".json" },
    { id: "contact", label: "contact", ext: ".txt" },
  ];
  return `
    <div class="tabbar">
      <div class="tabbar-inner">
        <div class="tabbar-dots">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>
        ${tabs.map(t => `
          <button class="tab" data-tab="${t.id}">
            ${t.label}<span class="ext">${t.ext}</span>
            <span class="dirty"></span>
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

function renderHero() {
  return `
    <section id="home" class="hero">
      <div class="wrap">
        <div class="eyebrow">01 · home</div>
        <h1 class="hero-name">${esc(PROFILE.name)}<span class="dim">.dev</span></h1>
        <p class="hero-role">
          <span class="hl">@${esc(PROFILE.handle)}</span> — ${esc(PROFILE.role)} Below is a running log of things I've shipped, broken, and fixed again.
        </p>
        <div class="btn-row">
          <a class="btn primary" href="#projects">View projects →</a>
          <a class="btn" href="${PROFILE.links.github}" target="_blank" rel="noreferrer">GitHub</a>
          <a class="btn" href="${PROFILE.links.email}">Email me</a>
        </div>
        <div class="terminal">
          <div class="terminal-head">
            <span class="dot red" style="background:#e06050"></span>
            <span class="dot yellow" style="background:#e5c07b"></span>
            <span class="dot green" style="background:#7dd3c0"></span>
            <span class="path">~/portfolio — zsh</span>
          </div>
          <div class="terminal-body">
            <div class="prompt-line"><span class="prompt-sym">➜ </span><span id="typed-cmd"></span><span class="cursor" id="cmd-cursor"></span></div>
            <div class="type-out" id="typed-out" style="margin-top:10px;"></div>
          </div>
        </div>
      </div>
    </section>
  `;
}

function renderAbout() {
  return `
    <section id="about">
      <div class="wrap">
        <div class="eyebrow">02 · about.md</div>
        <h2 class="section-title">About</h2>
        <div class="about-grid">
          <div class="about-text">
            ${PROFILE.bio.map(p => `<p>${esc(p)}</p>`).join('')}
          </div>
          <ul class="stack-list">
            ${PROFILE.stack.map(s => `<li><span>${esc(s.label)}</span><span>${esc(s.value)}</span></li>`).join('')}
          </ul>
        </div>
      </div>
    </section>
  `;
}

function renderProjects() {
  return `
    <section id="projects">
      <div class="wrap">
        <div class="eyebrow">03 · projects.json</div>
        <h2 class="section-title">Projects</h2>
        <div class="project-grid">
          ${PROJECTS.map(p => `
            <a class="card" href="${p.url}" ${p.url !== '#' ? 'target="_blank" rel="noreferrer"' : ''}>
              <div class="card-top">
                <span class="file-name">${esc(p.name)}</span>
                <span class="ext-badge">${esc(p.ext)}</span>
              </div>
              <p class="desc">${esc(p.desc)}</p>
              <div class="tag-row">
                ${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}
              </div>
              <div class="card-meta">
                
                <span>view →</span>
              </div>
            </a>
          `).join('')}
        </div>
      </div>
    </section>
  `;
}

function renderContact() {
  return `
    <section id="contact">
      <div class="wrap">
        <div class="contact-box">
          <div class="eyebrow">04 · contact.txt</div>
          <h2 class="contact-title">Let's build something.</h2>
          <p class="contact-sub">Open to opportunities, collaborations, or just talking shop about code. Reach out any time.</p>
          <div class="contact-links">
            <a class="btn primary" href="${PROFILE.links.email}">Send an email</a>
            <a class="btn" href="${PROFILE.links.github}" target="_blank" rel="noreferrer">GitHub</a>
            <a class="btn" href="${PROFILE.links.linkedin}" target="_blank" rel="noreferrer">LinkedIn</a>
          </div>
        </div>
      </div>
    </section>
  `;
}

function renderFooter() {
  return `
    <div class="wrap">
      <footer>
        <span>© ${new Date().getFullYear()} ${esc(PROFILE.name)}</span>
        <span>built with vanilla js · hosted on github pages</span>
      </footer>
    </div>
  `;
}

function mount() {
  const root = document.getElementById('root');
  root.innerHTML =
    renderTabBar() +
    renderHero() +
    renderAbout() +
    renderProjects() +
    renderContact() +
    renderFooter();

  // typing effect
  const fullText = `whoami\n> ${PROFILE.name} — ${PROFILE.role}`;
  const [cmdLine, outLine] = fullText.split('\n');
  const cmdEl = document.getElementById('typed-cmd');
  const outEl = document.getElementById('typed-out');
  let i = 0;
  const full = cmdLine + '\n' + outLine;
  const iv = setInterval(() => {
    i++;
    const slice = full.slice(0, i);
    const parts = slice.split('\n');
    cmdEl.textContent = parts[0] || '';
    outEl.textContent = parts[1] || '';
    if (i >= full.length) clearInterval(iv);
  }, 22);

  // tab bar click-to-scroll + active state
  const tabs = Array.from(document.querySelectorAll('.tab'));
  const sections = ['home', 'about', 'projects', 'contact'].map(id => document.getElementById(id));

  function setActive(id) {
    tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === id));
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const id = tab.dataset.tab;
      setActive(id);
      document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
    });
  });

  setActive('home');

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) setActive(e.target.id);
    });
  }, { rootMargin: '-40% 0px -50% 0px' });

  sections.forEach(el => el && observer.observe(el));
}

document.addEventListener('DOMContentLoaded', mount);
</script>
</body>
</html>
